name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # NODE_ENV=production is exported in some local shells and makes npm skip devDependencies;
      # --include=dev keeps local and CI behaviour identical.
      - run: npm ci --include=dev
      - run: npm run test
      - run: npm run build
      # Bundles the Worker and validates wrangler.toml (bindings, assets) without credentials.
      - run: npm run deploy:dry
