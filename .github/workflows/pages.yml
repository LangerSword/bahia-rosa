name: pages

# The deployment the challenge asks for. The app is static; the print desk is local by design, so the
# deployed build serves the whole experience and falls back to the cast plate when no desk answers —
# and `?demo=launch` opens the payoff stage directly.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run test
      # The site is served from the domain root — bahia.langersword.in, a custom domain on this Pages
      # site — so the base is `/`. The project URL still works: Pages redirects it to the custom domain.
      - run: npm run build -- --base=/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
